name: Backup a Google Drive

# Se ejecuta cada vez que haces push a la rama 'main'
on:
  push:
    branches:
      - main

jobs:
  build-and-backup:
    runs-on: ubuntu-latest
    name: Crear Zip y Subir a Drive

    steps:
      # 1. Descargar tu código en la máquina virtual de GitHub
      - name: Checkout del código
        uses: actions/checkout@v3

      # 2. Crear un nombre de archivo único (con fecha y hora)
      - name: Generar nombre del archivo
        id: filename
        run: echo "NAME=backup-$(date +'%Y-%m-%d-%H-%M-%S').zip" >> $GITHUB_ENV

      # 3. Comprimir archivos (MODIFICADO)
      # Usamos 'git archive' para crear un zip solo con los archivos rastreados por Git.
      # Esto excluye automáticamente node_modules, .env, carpetas de build, etc.
      - name: Comprimir archivos
        run: git archive --format=zip --output=${{ env.NAME }} HEAD

      # 4. Usar la Action para subir a Drive
      - name: Subir a Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: ${{ env.NAME }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "false"